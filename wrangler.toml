name = "clown-dance-gallery"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "clown_gallery"
database_id = "6edcd637-2b49-4568-9074-feee1ace1ebc"

# CONTACT_TO_EMAIL and RESEND_API_KEY are both set as SECRETS, not vars here,
# so neither one ever sits in this file (which is tracked in git). Set them with:
#   wrangler pages secret put CONTACT_TO_EMAIL
#   wrangler pages secret put RESEND_API_KEY
# or via the Cloudflare dashboard (Pages project -> Settings -> Environment variables -> Encrypt).
